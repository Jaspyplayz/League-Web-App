name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Agent merge workflow starts this on main after each of its merges,
  # since GitHub doesn't run it for a push that workflow's token makes
  # (JAS-123). It also puts a "Run workflow" button on the Actions tab, which
  # the first step below allows only on main.
  workflow_dispatch:

# The token GitHub gives the job can only read the repo, like
# dependency-review.yml's. Nothing here writes to GitHub, so a bad package
# that runs during `npm ci` can't push or comment with it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Starting CI by hand is for main only. A run started on a PR's branch
      # would test it without main's newer commits, yet become the PR's
      # newest `check`, the one can-merge and GitHub's ruleset read, so it
      # fails here instead of passing for the PR (JAS-123).
      - if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start CI by hand only on main. A PR's CI runs from its pull_request event."
          exit 1
      - uses: actions/checkout@v7
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
