name: Agent merge sweep

# Agent merge starts when one of a PR's checks finishes, so a PR waits if its
# run is cancelled and no check is left to start another. That happened on
# 2026-11-02: 23 runs were cancelled, and PR 269 sat with every gate passing
# until Jasper merged it by hand (JAS-164). This starts Agent merge again for
# each PR still marked ready, so a cancelled run needs no person to recover.
#
# It can't merge anything itself. can-merge still decides, in the run this
# starts, and that run waits its turn behind any other run for the same branch.
on:
  schedule:
    # Every 15 minutes, away from the top of the hour, when GitHub says it's
    # most likely to delay or drop a schedule. Even so a run can come late, and
    # GitHub turns a schedule off after 60 days with no activity in the repo.
    - cron: "7,22,37,52 * * * *"

# Nothing by default; the job asks for only what it needs.
permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      # A public repo lets any token read PRs, but naming it keeps this working
      # if the repo goes private.
      pull-requests: read
      # Starts Agent merge, the same way Agent merge starts CI on main. GitHub
      # has no narrower permission for that, and it can't push or merge.
      actions: write
    steps:
      # No checkout and no npm ci, so nothing here runs the repo's code and a
      # quiet sweep takes seconds. A rough match on the Ready line is enough,
      # since the run it starts reads the line properly (readyToMerge in
      # scripts/can-merge-action-steps.ts). A test checks the match never
      # misses a line that passes.
      # </dev/null keeps gh from reading the other branch names as its input.
      - name: Start Agent merge for each PR marked ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh and the filter below both read this.
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate --jq '
            .[]
            | select(.head.ref | startswith("claude/"))
            | select(.head.repo.full_name == env.GH_REPO)
            | select((.body // "") | test("[*][*]Ready to merge:[*][*] *yes at "; "i"))
            | .head.ref' |
          while read -r branch; do
            echo "$branch is marked ready. Starting Agent merge for it."
            gh workflow run agent-merge.yml --ref main -f branch="$branch" </dev/null
          done
