name: Reviewer

# Fails a PR into main until the reviewer agent's verdict in its Review
# section names the head commit with no blockers (JAS-15). Main's ruleset
# requires this check, so nobody can merge before the review. Editing the
# description reruns it, so adding the verdict line passes it, and a push
# reruns it, so a new commit needs a new review.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer edit or push replaces a run still in progress.
concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the PR's base and head commits are both here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/can-merge-reviewer-check.ts
