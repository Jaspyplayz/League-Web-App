name: Reviewer

# Fails a PR into main until the reviewer agent's newest verdict in its
# Review section clears it (JAS-15): no blockers on the head commit, or on an
# earlier commit the PR added with only small changes since (decision record
# 0017). Main's ruleset requires this check, so nobody can merge before the
# review. Editing the description reruns it, so adding the verdict line
# passes it, and a push reruns it, so a big new commit needs a new review.
#
# The check runs main's copy of the script and its packages, never the PR's,
# so a PR can't change what judges it (JAS-43, decision record 0030).
on:
  # GitHub runs this trigger from main's copy of this file, whatever the PR
  # changes, so even a PR that edits this file gets main's check.
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # This trigger runs the PR's own copy of this file, so it isn't the guard.
  # It stays so Agent merge, which starts when a Reviewer run on a claude/
  # branch finishes, still starts. Decision record 0030 says why a PR's edited
  # copy can't outvote main's run, and what's still to confirm.
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Each trigger has its own group, so the two runs for one edit or push don't
# cancel each other.
concurrency:
  group: reviewer-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the PR's base commit and origin/main are here.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # No npm cache: a pull_request_target run shares main's cache, so it
      # neither restores nor saves one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx tsx scripts/can-merge-reviewer-check.ts
