name: Agent merge
# Every run's own branch is on main, so its name is the only place to see which
# PR's branch it's for (JAS-164).
run-name: Agent merge ${{ github.event.workflow_run.head_branch || inputs.branch }}

# Merges Claude Code's own PRs without a Claude session (JAS-121,
# docs/adr/0024-a-github-action-runs-can-merge.md). Each time one of a PR's
# workflows finishes, this runs `can-merge --merge` on it from main, once the
# PR's description says `**Ready to merge:** yes at <head sha>`. can-merge checks every gate
# at the PR's head commit and merges only if all pass, so most runs end in a
# refusal while another check is still going, and the last one to finish is
# the one that merges. After a merge it starts CI on main (JAS-123).
#
# A workflow_run workflow always runs as this file is on main, never a PR's
# copy, and the job checks out main. A PR's own code is never checked out or
# run here. What earlier merges put on main does run, so the steps below
# refuse or skip the files that would change which code the gates load
# (decision record 0032). A run started by name is different: GitHub uses the copy on the ref
# it's started on. The sweep always starts it on main, and the job's `if` skips
# any other ref. A branch's edited copy could drop that `if`, so what guards
# this route is who has write access to the repo, as with any workflow a branch
# adds (docs/adr/0024-a-github-action-runs-can-merge.md).
on:
  workflow_run:
    # Every named workflow that reports a check on a PR. Vercel's check comes
    # from Vercel's app and CodeQL's from a "dynamic" workflow named after the
    # PR, so neither can be listed. The smoke test starts only once Vercel's
    # preview is live and takes minutes, so Vercel has reported by the time it
    # finishes, and CodeQL has finished first on every recent Claude PR.
    workflows: [CI, Reviewer, Smoke test, Dependency review]
    types: [completed]
  # Another try for a PR whose last run didn't finish. The Agent merge sweep
  # starts these (agent-merge-sweep.yml, JAS-164), and a person can from the
  # Actions tab.
  workflow_dispatch:
    inputs:
      branch:
        description: The claude/ branch whose PR to try
        required: true
        type: string

# Nothing by default; the job asks for only what merging needs.
permissions: {}

jobs:
  merge:
    # Only a successful run on one of Claude's branches in this repo, or a run
    # started by name on main for one of Claude's branches. Anything else (main,
    # Jasper's branches, Dependabot's, a failed or cancelled run) shows as a
    # skipped run and never starts a runner, since can-merge couldn't merge it.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      startsWith(inputs.branch, 'claude/')) ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # A run normally takes under two minutes. A hung one would hold its branch's
    # queue for GitHub's default of six hours, and the sweep couldn't help.
    timeout-minutes: 10
    # One run per branch at a time, so two checks finishing together, or a
    # check and a run started by name, can't both merge or both comment. A new
    # run never cancels a running one, since it may be mid-merge; a queued one
    # is replaced by the newest, which reads the latest state anyway. This
    # doesn't stop a cancel from outside: at least 24 runs on 2026-11-02 were
    # cancelled with the note "canceled by @Jaspyplayz", cause unknown
    # (JAS-164). So the sweep starts another run for any PR still marked ready
    # at its head and touched in the last day.
    concurrency:
      group: agent-merge-${{ github.event.workflow_run.head_branch || inputs.branch }}
      cancel-in-progress: false
    permissions:
      contents: write # merge the PR
      pull-requests: write # read and merge the PR
      issues: write # the gates comment and the merged-by-claude label
      # can-merge reads the PR's check runs, workflow runs and commit
      # statuses. A public repo lets any token read them, but naming them
      # keeps this working if the repo goes private.
      checks: read
      # write also starts ci.yml on main after a merge, since GitHub runs no
      # workflow for a push this token makes (JAS-123). It includes read.
      actions: write
      statuses: read
    steps:
      # checkout uses the job's token for this one fetch of main, and
      # persist-credentials: false removes it from .git/config afterwards.
      - uses: actions/checkout@v7
        with:
          ref: main
          # The whole history: can-merge diffs the PR against main and reads
          # main's merges and reverts.
          fetch-depth: 0
          # The repo is public, so git fetches the PR's commits without it.
          persist-credentials: false
      # No npm cache. Dependencies install from npm against main's lockfile,
      # so nothing another workflow saved can change the code that runs with
      # the token below.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Claude can merge package.json, .npmrc, tsconfig.json and the lockfile
      # after the panel, so these steps stop the ones found so far from changing
      # which code runs below with the token (decision record 0032). npx runs
      # package.json's own bin ahead of node_modules/.bin, and a package scope
      # with exports, imports or workspaces, or a node_modules/ folder beside the
      # gates, can stand in for zod, which every gate imports.
      - name: Refuse files that would change what the gates load
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fields = ["bin", "exports", "imports", "workspaces"].filter((key) => key in require("./package.json"));
            const tracked = execFileSync("git", ["ls-files", "scripts/node_modules", "scripts/package.json"], { encoding: "utf8" }).trim();
            if (fields.length > 0 || tracked !== "") {
              console.error(`package.json fields: ${fields.join(", ") || "none"}; under scripts/: ${tracked || "nothing"}`);
              process.exit(1);
            }
          '
      # An .npmrc could set node-options, npm-shrinkwrap.json would replace the
      # lockfile, and an install script could rewrite the gates on disk. The
      # dependencies themselves still come from main's lockfile.
      - run: rm -rf .npmrc npm-shrinkwrap.json && npm ci --ignore-scripts
      - run: npx tsx scripts/can-merge-action.ts
        env:
          # npm ci above runs without the token in its environment.
          GH_TOKEN: ${{ github.token }}
          # gh fills in can-merge's {owner}/{repo} from this.
          GH_REPO: ${{ github.repository }}
          # tsx reads this in place of tsconfig.json, here and in the can-merge
          # run the script starts, so tsconfig.json's paths can't swap a module
          # the gates import, such as zod.
          TSX_TSCONFIG_PATH: scripts/can-merge.tsconfig.json
